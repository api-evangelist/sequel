aid: sequel
name: Sequel
description: >-
  Sequel is a webinar and virtual-event platform for data-driven marketing teams. It
  runs live, simulive, and on-demand event experiences directly on a company's own
  domain, capturing unified first-party engagement data (watch time, polls, questions,
  CTA clicks) and syncing it to CRMs like Salesforce, HubSpot, Marketo, and Pardot.
  Sequel exposes a REST API (the Introvoke API) for managing companies, events,
  presenters, organizers, registrants, networking hubs, customization/theming,
  analytics, simulive video, MediaHub assets, and webhooks, plus pre-built embeddable
  video/networking components, a JavaScript SDK, and an official hosted MCP server that
  gives AI agents read access to webinar transcripts for content repurposing.
