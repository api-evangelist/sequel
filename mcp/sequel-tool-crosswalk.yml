notes: >-
  The MCP server is deliberately a read-only, transcript-focused slice of the platform:
  it exposes browsing (companies, events) plus the transcript capability the REST API
  does not publish at all. Every write operation in the REST surface — creating events,
  managing presenters, registrants, networking hubs, themes and simulive — has no MCP
  tool, so an agent cannot mutate a Sequel account through the published agent surface.
