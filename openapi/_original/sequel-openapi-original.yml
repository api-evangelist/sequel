openapi: 3.0.1
info:
  title: Introvoke API
  description: This is the documentation required to access the Introvoke API. It contains information
    on how to create Companies, add events to each company and manage the presenters.
  termsOfService: https://www.introvoke.com/terms/
  contact:
    email: support@introvoke.com
  version: 1.0.0
servers:
- url: https://api.introvoke.com/api/v1
security:
- bearerAuth: []
tags:
- name: company
  description: Calls to managing companies
- name: event
  description: Calls to managing events
- name: networking
  description: Calls to managing networking hubs
paths:
  /api/analytics/getVideoWatchOverTime/{EVENT_ID}:
    get:
      summary: Live video watched over time
      description: The endpoint returns peak concurrent users for each minute during a live event
      operationId: live-video-watched-over-time
      parameters:
      - name: EVENT_ID
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"VideoViews":[[0,3],[1,3],[2,3],[3,3],[4,12],[5,10],[6,13],[7,13],[8,14],[9,14],[10,16]]}'
              schema:
                type: object
                properties:
                  VideoViews:
                    type: array
                    items:
                      type: array
                      items:
                        type: integer
                        example: 0
                        default: 0
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: Token not found
        '404':
          description: '404'
          content:
            text/plain:
              examples:
                Result:
                  value: Event not found
      deprecated: false
  /api/analytics/user-engagement/events/{eventId}/top-participants (COPY):
    get:
      summary: Participant List with engaged minutes
      description: ''
      operationId: participant-list-with-engaged-minutes
      parameters:
      - name: eventId
        in: path
        schema:
          type: string
        required: true
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 10
      - name: startDate
        in: query
        schema:
          type: string
          format: date
      - name: endDate
        in: query
        schema:
          type: string
          format: date
      - name: engagementType
        in: query
        schema:
          type: string
          enum:
          - all
          - live
          - onDemand
          default: all
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"eventName\": \"From One-time Events to Recurring Engagements  \",\n \
                    \ \"eventId\": \"2f64d929-aa02-457d-852a-50b2756e3029\",\n  \"eventType\": \"virtualStageEvent\"\
                    ,\n  \"company\": \"Introvoke Marketing\",\n  \"companyId\": \"fab4f3d2-aaf8-49ab-a5c0-0924b8773593\"\
                    ,\n  \"startDate\": null,\n  \"endDate\": \"2022-08-23T09:56:13.937Z\",\n  \"limit\"\
                    : 10,\n  \"numberOfUsers\": 57,\n  \"totalEngagedMinutes\": 898,\n  \"averageEngagedMinutesByUser\"\
                    : 15.75,\n  \"topParticipants\": [\n    {\n      \"name\": \"Yuliya\",\n      \"userEmail\"\
                    : \"yuliya@sequel.io\",\n      \"engagedMinutes\": 113\n    },\n    {\n      \"name\"\
                    : \"Oana\",\n      \"userEmail\": \"oana@sequel.io\",\n      \"engagedMinutes\": 108\n\
                    \    },\n    {\n      \"name\": \"Connor Kirsch\",\n      \"userEmail\": \"connor@sequel.io\"\
                    ,\n      \"engagedMinutes\": 107\n    },\n    {\n      \"name\": \"jennifer li\",\n\
                    \      \"userEmail\": \"jennifer.li.125@gmail.com\",\n      \"engagedMinutes\": 45\n\
                    \    },\n    {\n      \"name\": \"Andrei Ermilov\",\n      \"userEmail\": \"andrei@sequel.io\"\
                    ,\n      \"engagedMinutes\": 41\n    },\n    {\n      \"name\": \"Zach\",\n      \"\
                    userEmail\": \"zach@sequel.io\",\n      \"engagedMinutes\": 38\n    },\n    {\n  \
                    \    \"name\": \"Eric\",\n      \"userEmail\": \"eric@sequel.io\",\n      \"engagedMinutes\"\
                    : 32\n    },\n    {\n      \"name\": \"Kevin Verronneau\",\n      \"userEmail\": \"\
                    kevin@edny.com\",\n      \"engagedMinutes\": 31\n    },\n    {\n      \"name\": \"\
                    Logan Amstey\",\n      \"userEmail\": \"logan@sequel.io\",\n      \"engagedMinutes\"\
                    : 31\n    },\n    {\n      \"name\": \"Rachel \",\n      \"userEmail\": \"rachel@earthcoast.com\"\
                    ,\n      \"engagedMinutes\": 31\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  eventName:
                    type: string
                    example: 'From One-time Events to Recurring Engagements  '
                  eventId:
                    type: string
                    example: 2f64d929-aa02-457d-852a-50b2756e3029
                  eventType:
                    type: string
                    example: virtualStageEvent
                  company:
                    type: string
                    example: Introvoke Marketing
                  companyId:
                    type: string
                    example: fab4f3d2-aaf8-49ab-a5c0-0924b8773593
                  startDate: {}
                  endDate:
                    type: string
                    example: '2022-08-23T09:56:13.937Z'
                  limit:
                    type: integer
                    example: 10
                    default: 0
                  numberOfUsers:
                    type: integer
                    example: 57
                    default: 0
                  totalEngagedMinutes:
                    type: integer
                    example: 898
                    default: 0
                  averageEngagedMinutesByUser:
                    type: number
                    example: 15.75
                    default: 0
                  topParticipants:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Yuliya
                        userEmail:
                          type: string
                          example: yuliya@sequel.io
                        engagedMinutes:
                          type: integer
                          example: 113
                          default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /api/client/removeEventSimulive:
    put:
      summary: Remove simulive from an event
      description: Use this endpoint to remove the Simulive video for an event.
      operationId: remove-simulive-event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /api/client/setEventSimuliveUrl:
    put:
      summary: Set simulive for an event
      description: Use this endpoint to set the Simulive video for an event. The event will automatically
        go live at the start time.
      operationId: set-event-simulive
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                url:
                  type: string
                  description: The public URL of the video to be used as simulive. This URL MUST be accessible
                    without any login, test the url in incognito before setting or the simulive will fail.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /api/media/create-asset:
    get:
      description: ''
      operationId: get_apimediacreate-asset
      responses:
        '200':
          description: ''
      parameters: []
  /api/media/upload-asset:
    get:
      description: ''
      operationId: get_apimediaupload-asset
      responses:
        '200':
          description: ''
      parameters: []
  /company/{companyId}:
    get:
      tags:
      - company
      summary: Find company by ID
      description: Returns a single company
      operationId: getcompanyById
      parameters:
      - name: companyId
        in: path
        description: ID of company to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Invalid ID supplied
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: company not found
          content: {}
    post:
      tags:
      - company
      summary: Update a company with json data
      operationId: updatecompanyWithJson
      parameters:
      - name: companyId
        in: path
        description: ID of company that needs to be updated
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Company id not found
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Invalid input
          content: {}
  /company/{companyId}/circleRecordings:
    get:
      tags:
      - company
      summary: Get all circle recordings for a company
      description: Returns a list of all circle recordings associated with the company
      operationId: getCompanyCircleRecordings
      parameters:
      - name: companyId
        in: path
        description: ID of company to get circle recordings for
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyCircleRecording'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Company not found
          content: {}
  /company/{companyId}/create:
    post:
      tags:
      - company
      summary: Create a new company under a parent company
      operationId: addCompanyToParent
      parameters:
      - name: companyId
        in: path
        description: ID of company to return
        required: true
        schema:
          type: string
      requestBody:
        description: Company object that needs to be added under a parent company
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          description: Invalid input
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Parent company has an invalid license
          content: {}
  /company/{companyId}/events:
    get:
      tags:
      - company
      summary: List all events under a parent company
      operationId: listCompanyEvents
      parameters:
      - name: companyId
        in: path
        description: ID of company to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Parent company has an invalid license
          content: {}
  /company/{companyId}/list:
    get:
      tags:
      - company
      summary: List all companies under a parent company
      operationId: listChildCompanies
      parameters:
      - name: companyId
        in: path
        description: ID of company to return
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '400':
          description: Invalid input
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Parent company has an invalid license
          content: {}
  /company/{companyId}/metadata:
    post:
      tags:
      - company
      summary: Update metadata for the company
      operationId: updateCompanyMetadata
      parameters:
      - name: companyId
        in: path
        description: ID of company to update
        required: true
        schema:
          type: string
      requestBody:
        description: Metadata object to update in the company
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metadata'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '400':
          description: Invalid input
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /customizations/events/company/{companyId}/all-events:
    delete:
      description: Deletes the event customization theme for company. The events without their own customization
        will use the default Introvoke Platform theme, after deletion.
      tags:
      - company theme overrides
      parameters:
      - in: path
        name: companyId
        required: true
        description: Unique ID of the company
        schema:
          type: string
      responses:
        '200':
          description: Event Customization Theme Overrides for the company removed from the data store.
        '404':
          description: Company ID is incorrect or user does not have access to the company.
    get:
      description: 'Returns the event customization theme overrides over the platform event customization
        theme that applies to all events for the company, unless overridden at the event level.

        This endpoint can be used for clients which update to theme or for preview.'
      tags:
      - company theme overrides
      parameters:
      - in: path
        name: companyId
        required: true
        description: Unique ID of the company
        schema:
          type: string
      - in: query
        name: fullTheme
        description: flag to return full theme merged with overrides
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: event customization theme overrides (or full theme) at company level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrovokeEventTheme'
        '404':
          description: Company ID is incorrect or user does not have access to the company.
    post:
      description: 'Adds or updates event customization theme overrides that will be applied to the all
        events for the company.

        This endpoint can be used by clients which update to theme or for preview.'
      tags:
      - company theme overrides
      parameters:
      - in: path
        name: companyId
        required: true
        description: Unique ID of the company
        schema:
          type: string
      requestBody:
        description: The part of event customization theme to override in default platform theme.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrovokeEventTheme'
      responses:
        '202':
          description: Theme overrides accepted and committed to data store
        '400':
          description: Theme overrides did not match the expected schema.
        '404':
          description: Company ID is incorrect or user does not have access to the company
  /customizations/events/company/{companyId}/fonts:
    get:
      description: Returns list of customized fonts associated with the company
      tags:
      - company theme fonts
      parameters:
      - in: path
        name: companyId
        required: true
        description: Unique ID of the company
        schema:
          type: string
      responses:
        '200':
          description: list of custom fonts associated with company
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyFontInfo'
        '404':
          description: Company ID is incorrect or user does not have access to the company
    post:
      description: Add new fonts for the company. The value is stored at the company level, but can be
        used by customization themes on both event and company levels. If the name of the font, matches
        the existing font, it will update the font URL.
      tags:
      - company theme fonts
      parameters:
      - in: path
        name: companyId
        required: true
        description: Unique ID of the companyId
        schema:
          type: string
      requestBody:
        description: The new company font to upload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyFontInfo'
      responses:
        '202':
          description: Font accepted and committed to data store
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
        '400':
          description: Incorrect format for the font schema
        '404':
          description: Company ID is incorrect or user does not have access to the company
  /customizations/events/company/{companyId}/fonts/font/{fontId}:
    delete:
      description: Unregister the specified font associated with the specified company.
      tags:
      - company theme fonts
      parameters:
      - in: path
        name: companyId
        required: true
        description: Unique ID of the company
        schema:
          type: string
      - in: path
        name: fontId
        required: true
        description: Unique ID of the registered font
        schema:
          type: string
      responses:
        '200':
          description: Font unregistered from the company.
        '404':
          description: Company or Font Id is incorrect or user does not have access to the company.
  /customizations/events/default:
    get:
      description: 'Returns the default event customization theme that applies to all events, unless overridden
        at the company and event level.

        This endpoint can be used for clients which update to theme or for preview. The default theme
        can be used as a starting point to edit new themes.'
      tags:
      - platform
      responses:
        '200':
          description: default platform event customization theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrovokeEventTheme'
  /customizations/events/event/{eventId}:
    delete:
      description: Deletes the event customization theme overrides for the event. All events default to
        company specific event customization theme, if it exists or the default platform theme, after
        deletion.
      tags:
      - event theme overrides
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      responses:
        '200':
          description: Theme overrides for the event removed from the data store.
        '404':
          description: Event Id is incorrect or user does not have access to the event.
    get:
      description: 'Returns the event customization theme overrides over the platform and event company
        customization theme for the event.

        This endpoint can be used for clients which update to theme or for preview.'
      tags:
      - event theme overrides
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      - in: query
        name: fullTheme
        description: flag to return full theme merged with overrides
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: event customization theme overrides (or full theme) at applied at event level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrovokeEventTheme'
    post:
      description: 'Adds or updates event customization theme overrides that will be applied for the event.

        This endpoint can be used by clients which update to theme or for preview.'
      tags:
      - event theme overrides
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      requestBody:
        description: The part of event customization theme to override in default platform and company
          theme.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntrovokeEventTheme'
      responses:
        '202':
          description: Theme overrides accepted and committed to data store.
        '400':
          description: Theme overrides did not match the expected schema.
        '404':
          description: Event ID is incorrect or user does not have access to the event.
  /customizations/events/suggested-color-pallets:
    get:
      description: Returns an array of color pallets (with primary, secondary and tertiary colors) that
        can be used in the editor. This endpoint can be used for clients which update to theme or for
        preview.
      tags:
      - platform
      responses:
        '200':
          description: suggested color pallets
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  nullable: true
                  items:
                    type: string
                    nullable: true
                    minItems: 2
                    maxItems: 3
  /event/create:
    post:
      tags:
      - event
      summary: Create a new event
      operationId: addEvent
      requestBody:
        description: Event object that needs to be added to the backend
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                common host and presenter emails:
                  value:
                    hasError: true
                    errorMessage: 'Users cannot be hosts and presenters at the same time: test@email.com'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                hasError: true
                errorMessage: Company not found
  /event/{eventId}:
    delete:
      tags:
      - event
      summary: Delete an event
      operationId: deleteevent
      parameters:
      - name: eventId
        in: path
        description: event id to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
    get:
      tags:
      - event
      summary: Find event by ID
      description: Returns a single event
      operationId: geteventById
      parameters:
      - name: eventId
        in: path
        description: ID of event to return
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid ID supplied
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
    post:
      tags:
      - event
      summary: Update an event with json data
      operationId: updateEventWithJsonData
      parameters:
      - name: eventId
        in: path
        description: ID of event that needs to be updated
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                hasError: true
                errorMessage: 'Users cannot be hosts and presenters at the same time: test@email.com'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Event not found
          content: {}
  /event/{eventId}/availableReplays:
    get:
      summary: Return a list of replays for this event
      description: Returns an array of replays for this event
      tags:
      - event
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      - in: query
        name: secondsValidFor
        required: false
        description: Number of seconds the replay is valid for. 3600 (1 hour) by default.
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: list of replays
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    downloadVideoUrl:
                      type: string
                    downloadStatus:
                      type: string
                    isCustomReplay:
                      type: boolean
                    url:
                      type: string
                  additionalProperties: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
  /event/{eventId}/clone:
    post:
      tags:
      - event
      summary: 'Create a new event based on source event '
      operationId: cloneEvent
      requestBody:
        description: 'Event object that needs to be added to the backend. Body props that are optional
          and will be taken from source event if missing in request: `name`, `bannerUrl`, `networkingHub`,
