components:
  schemas:
    CircleRecording:
      type: object
      properties:
        downloadUrl:
          type: string
        expiresOn:
          type: string
    Company:
      type: object
      properties:
        uid:
          type: string
        name:
          type: string
        logo:
          type: string
        parentCompanyId:
          type: string
          nullable: true
        eventIds:
          description: Holds an array of all the events for this company
          type: array
          items:
            type: string
          nullable: true
        metadata:
          $ref: '#/components/schemas/Metadata'
      xml:
        name: Company
    CompanyCircleRecording:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the circle recording
        name:
          type: string
          description: Name of the circle recording
        url:
          type: string
          description: Public URL to access the recording
        downloadVideoUrl:
          type: string
          description: URL to download the video recording
      required:
      - id
      - name
      - url
      - downloadVideoUrl
    CompanyCreate:
      required:
      - name
      - logo
      - metadata
      type: object
      properties:
        name:
          type: string
          description: Name of the company
        logo:
          type: string
          description: Logo of the company
    CompanyFontInfo:
      type: object
      properties:
        uid:
          type: string
        fontName:
          type: string
        fontUrl:
          type: string
        isIntrovokeManaged:
          type: boolean
      additionalProperties: false
      required:
      - fontName
      - fontUrl
      - isIntrovokeManaged
    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
          description: Updated name of the company
        logo:
          type: string
          description: Updated logo of the company
    Error:
      type: object
      properties:
        hasError:
          description: Always `true` if the request has failed.
          type: boolean
          default: true
        errorMessage:
          type: string
          description: The error message describing the issue.
    Event:
      type: object
      properties:
        uid:
          type: string
        companyUid:
          type: string
        creatorUid:
          type: string
        name:
          type: string
        picture:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        timezone:
          type: string
        type:
          type: string
          enum:
          - Virtual
          - LiveStreamInPerson
        metadata:
          description: Can be any value - string, number, boolean, array or object.
          type: object
          nullable: true
        networkingHub:
          type: string
          description: (Optional) The networking hub linked when networking starts
          nullable: true
        presenters:
          type: array
          nullable: true
          items:
            type: string
        organizers:
          type: array
          nullable: true
          items:
            type: string
        isRegistrationModeEnabled:
          type: boolean
          nullable: true
        isAttendeeRegistrationModeEnabled:
          type: boolean
          nullable: true
        privateEventInfo:
          type: object
          nullable: true
          properties:
            attendeePasscode:
              type: string
            presenterPasscode:
              type: string
            hostPasscode:
              type: string
            rtmpKey:
              type: string
            rtmpUrl:
              type: string
        closeCaptioningSettings:
          type: object
          nullable: true
          properties:
            transcription:
              type: object
              nullable: true
              properties:
                enabled:
                  type: boolean
                  nullable: true
      xml:
        name: Event
    EventClone:
      required:
      - name
      - startDate
      - endDate
      - timezone
      type: object
      properties:
        name:
          type: string
          description: Name of the event
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        timezone:
          $ref: '#/components/schemas/Timezones'
        type:
          type: string
