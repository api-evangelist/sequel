  /networking/{id}/clearChat:
    post:
      tags:
      - networking
      summary: Clear all networking hub chat channels with the option to clear individual circles
      operationId: postClearChat
      parameters:
      - name: id
        in: path
        description: ID of NetworkingHub
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: '

          To specify which chats to clear, follow the patterns below:

          - Networking Hub: `${hubId}-chat` and `${hubId}-presenters-chat`

          - Circle: `${hubId}-${circleId}-circle-chat`'
        content:
          application/json:
            schema:
              type: object
              properties:
                channels:
                  description: When included, only the chats for the provided channels will be cleared.
                    Otherwise, all chats will be cleared by default.
                  type: array
                  items:
                    type: string
                hard:
                  description: (Optional) boolean flag specifying whether to delete the chats permanently
                    (true) or hide them (default)
                  type: boolean
              example:
                channels:
                - 123456789-chat
                - 123456789-presenters-chat
                - 123456789-123-circle-chat
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    channel:
                      type: string
                    success:
                      type: boolean
                example:
                - channel: 123456789-chat
                  success: true
                - channel: 123456789-presenters-chat
                  success: true
                - channel: 123456789-123-circle-chat
                  success: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
