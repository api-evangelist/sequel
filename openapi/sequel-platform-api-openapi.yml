openapi: 3.2.0
info:
  title: Introvoke Platform API
  description: This is the documentation required to access the Introvoke API. It contains information on how to create Companies, add events to each company and manage the presenters.
  termsOfService: https://www.introvoke.com/terms/
  contact:
    email: support@introvoke.com
  version: 1.0.0
servers:
- url: https://api.introvoke.com/api/v1
security:
- bearerAuth: []
tags:
- name: Platform
paths:
  /customizations/events/default:
    get:
      description: 'Returns the default event customization theme that applies to all events, unless overridden at the company and event level.

        This endpoint can be used for clients which update to theme or for preview. The default theme can be used as a starting point to edit new themes.'
      tags:
      - Platform
      responses:
        '200':
          description: default platform event customization theme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrovokeEventTheme'
      summary: Get customizations events default
      x-summary-source: derived
      operationId: getCustomizationsEventsDefault
      x-operation-id-source: derived
  /customizations/events/suggested-color-pallets:
    get:
      description: Returns an array of color pallets (with primary, secondary and tertiary colors) that can be used in the editor. This endpoint can be used for clients which update to theme or for preview.
      tags:
      - Platform
      responses:
        '200':
          description: suggested color pallets
          content:
            application/json:
              schema:
                type: array
                items:
                  type:
                  - array
                  - 'null'
                  items:
                    type:
                    - string
                    - 'null'
                    minItems: 2
                    maxItems: 3
      summary: Get customizations events suggested color pallets
      x-summary-source: derived
      operationId: getCustomizationsEventsSuggestedColorPallets
      x-operation-id-source: derived
components:
