                - 'null'
                properties:
                  reaction:
                    type: string
                  image:
                    type: string
                  label:
                    type:
                    - string
                    - 'null'
                maxItems: 7
                required:
                - reaction
                - image
                additionalProperties: false
          additionalProperties: false
        emailSettings:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
            name:
              type: string
            when:
              type: string
            replayToEmail:
              type:
              - string
              - 'null'
            fromEmail:
              type:
              - string
              - 'null'
            fromName:
              type:
              - string
              - 'null'
            isCustom:
              type: boolean
            activated:
              type: boolean
            emailTemplate:
              type: object
              properties:
                name:
                  type: string
                subject:
                  type:
                  - string
                  - 'null'
                hoursToWait:
                  type:
                  - number
                  - 'null'
                htmlBody:
                  type:
                  - string
                  - 'null'
                sendGridTemplateId:
                  type:
                  - string
                  - 'null'
                bodyText:
                  type:
                  - string
                  - 'null'
      additionalProperties: false
      required:
      - name
      - defaultTheme
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
