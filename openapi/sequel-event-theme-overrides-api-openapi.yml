              - string
              - 'null'
          additionalProperties: false
        chat:
          type: object
          properties:
            enabled:
              type:
              - boolean
              - 'null'
            colors:
              type:
              - array
              - 'null'
              items:
                type:
                - string
                - 'null'
            badge:
              type: object
              properties:
                backgroundColor:
                  type:
                  - string
                  - 'null'
                imageUrl:
                  type:
                  - string
                  - 'null'
                textColor:
                  type:
                  - string
                  - 'null'
              additionalProperties: false
          additionalProperties: false
        participantList:
          type:
          - object
          - 'null'
          properties:
            enabled:
              type:
              - boolean
              - 'null'
              deprecated: true
            showTabFor:
              type:
              - number
              - 'null'
              description: Expects a number for the user role. 0 - Host, 1 - Host & Presenter, 2 - Everyone
            showCountFor:
              type:
              - number
              - 'null'
              description: Expects a number for the user role. 0 - Host, 1 - Host & Presenter, 2 - Everyone
