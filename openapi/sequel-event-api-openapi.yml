openapi: 3.2.0
info:
  title: Introvoke Event API
  description: This is the documentation required to access the Introvoke API. It contains information on how to create Companies, add events to each company and manage the presenters.
  termsOfService: https://www.introvoke.com/terms/
  contact:
    email: support@introvoke.com
  version: 1.0.0
servers:
- url: https://api.introvoke.com/api/v1
security:
- bearerAuth: []
tags:
- name: Event
  description: Calls to managing events
paths:
  /event/create:
    post:
      tags:
      - Event
      summary: Create a new event
      operationId: addEvent
      requestBody:
        description: Event object that needs to be added to the backend
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
        required: true
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                common host and presenter emails:
                  value:
                    hasError: true
                    errorMessage: 'Users cannot be hosts and presenters at the same time: test@email.com'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Company not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                hasError: true
                errorMessage: Company not found
  /event/{eventId}:
    delete:
      tags:
      - Event
      summary: Delete an event
      operationId: deleteevent
      parameters:
      - name: eventId
        in: path
        description: event id to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
        '400':
          description: Invalid ID supplied
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
    get:
      tags:
      - Event
      summary: Find event by ID
      description: Returns a single event
      operationId: geteventById
      parameters:
      - name: eventId
        in: path
        description: ID of event to return
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid ID supplied
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
    post:
      tags:
      - Event
      summary: Update an event with json data
      operationId: updateEventWithJsonData
      parameters:
      - name: eventId
        in: path
        description: ID of event that needs to be updated
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventUpdate'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                hasError: true
                errorMessage: 'Users cannot be hosts and presenters at the same time: test@email.com'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Event not found
          content: {}
  /event/{eventId}/availableReplays:
    get:
      summary: Return a list of replays for this event
      description: Returns an array of replays for this event
      tags:
      - Event
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      - in: query
        name: secondsValidFor
        required: false
        description: Number of seconds the replay is valid for. 3600 (1 hour) by default.
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: list of replays
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    downloadVideoUrl:
                      type: string
                    downloadStatus:
                      type: string
                    isCustomReplay:
                      type: boolean
                    url:
                      type: string
                  additionalProperties: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
      operationId: getEventByEventIdAvailableReplays
      x-operation-id-source: derived
  /event/{eventId}/clone:
    post:
      tags:
      - Event
      summary: Create a new event based on source event
      operationId: cloneEvent
      requestBody:
        description: 'Event object that needs to be added to the backend. Body props that are optional and will be taken from source event if missing in request: `name`, `bannerUrl`, `networkingHub`, `presenterPasscode`, `hostPasscode`, `attendeePasscode`, `isAttendeeRegistrationModeEnabled`, `isPresenterRegistrationModeEnabled`, `isRegistrationModeEnabled`, `hosts`, `presenters`. Additionaly event customization, list of hosts and presenters is also copied from source event'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventClone'
        required: true
      parameters:
      - name: eventId
        in: path
        description: ID of event to return
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid input
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /event/{eventId}/embedCode:
    post:
      tags:
      - Event
      summary: Return the embed code for the event component
      operationId: getEmbedEventById
      requestBody:
        description: Object used to identify the user
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      parameters:
      - name: eventId
        in: path
        description: ID of event for the embed code
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
                description: The url source that needs to be added to an iframe
                example: https://embed.introvoke.com/event/{eventId}?userEmail={userEmail}&userId={userId}&userName={userDisplayName}&userProfile={userAvatar}&authKey={serverGenerated}
        '400':
          description: Invalid parameters supplied
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
  /event/{eventId}/organizer:
    put:
      tags:
      - Event
      summary: Add an organizer id to the event
      description: Returns the updated list of organizers
      operationId: putHostById
      parameters:
      - name: eventId
        in: path
        description: ID of event to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                organizer:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                description: Array of organizer ids
                items:
                  type: string
        '400':
          description: Invalid payload was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing organizer field:
                  value:
                    hasError: true
                    errorMessage: Missing organizer field in request
                common host and presenter emails:
                  value:
                    hasError: true
                    errorMessage: 'Users cannot be hosts and presenters at the same time: test@email.com'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Event not found
          content: {}
  /event/{eventId}/organizer/{organizerId}:
    delete:
      tags:
      - Event
      summary: Delete an organizer id from the event
      description: Returns the updated list of organizers
      operationId: deleteHostById
      parameters:
      - name: eventId
        in: path
        description: ID of event to update
        required: true
        schema:
          type: string
          format: uuid
      - name: organizerId
        in: path
        description: ID of the organizer to delete
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                description: Array of organizer ids
                items:
                  type: string
        '400':
          description: Invalid parameter was sent
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
  /event/{eventId}/presenter:
    put:
      tags:
      - Event
      summary: Add a presenter id to the event
      description: Returns the updated list of presenters
      operationId: putPresenterById
      parameters:
      - name: eventId
        in: path
        description: ID of event to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                presenter:
                  type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                description: Array of presenter ids
                items:
                  type: string
        '400':
          description: Invalid payload was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missing presenter field:
                  value:
                    hasError: true
                    errorMessage: Missing presenter field in request
                common host and presenter emails:
                  value:
                    hasError: true
                    errorMessage: 'Users cannot be hosts and presenters at the same time: test@email.com'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
  /event/{eventId}/presenter/{presenterId}:
    delete:
      tags:
      - Event
      summary: Delete a presenter id from the event
      description: Returns the updated list of presenters
      operationId: deletePresenterById
      parameters:
      - name: eventId
        in: path
        description: ID of event to update
        required: true
        schema:
          type: string
          format: uuid
      - name: presenterId
        in: path
        description: ID of the presenter to delete
        required: true
        schema:
          type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                description: Array of presenter ids
                items:
                  type: string
        '400':
          description: Invalid parameter was sent
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
  /event/{eventId}/registrant:
    delete:
      tags:
      - Event
      summary: Delete a registered user from the event
      description: Returns OK
      operationId: deleteRegistrantById
      parameters:
      - name: eventId
        in: path
        description: ID of event to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The user email to delete
              additionalProperties: false
              required:
              - email
      responses:
        '204':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
                description: OK message
        '400':
          description: Invalid parameter was sent
          content: {}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: event not found
          content: {}
    post:
      summary: Register a user for the event
      description: Adds a new registered user to this event
      tags:
      - Event
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the user
                email:
                  type: string
                  description: The email of the user
                metadata:
                  type: object
                  description: Additional metadata to include about the user
                  additionalProperties: true
              required:
              - name
              - email
      responses:
        '200':
          description: User was registered for this event
          content:
            application/json:
              schema:
                type: object
                description: Information about the registered user
                properties:
                  name:
                    type: string
                    description: The name of the user
                  email:
                    type: string
                    description: The email of the user
                  join_url:
                    type: string
                    description: The unique url that the user can use to join the event
                  metadata:
                    type: object
                    description: Additional metadata to include about the user
                    additionalProperties: true
                additionalProperties: false
        '400':
          description: An invalid parameter was sent
        '404':
          description: Invalid auth token
      operationId: postEventByEventIdRegistrant
      x-operation-id-source: derived
  /event/{eventId}/registrants:
    get:
      summary: Return a list of all registered users
      description: Returns an array of registrants for this event
      tags:
      - Event
      parameters:
      - in: path
        name: eventId
        required: true
        description: Unique ID of the event
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                description: List of registered users
                items:
                  type: object
                  description: Information about a single registered user
                  properties:
                    name:
                      type: string
                      description: The name of the user
                    email:
                      type: string
                      description: The email of the user
                    join_url:
                      type: string
                      description: The unique url that the user can use to join the event
                    metadata:
                      type: object
                      description: Additional metadata that was included when the user registered
                      additionalProperties: true
                  additionalProperties: false
          description: Returns list of participants
      operationId: getEventByEventIdRegistrants
      x-operation-id-source: derived
components:
